<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 740" width="100%" role="img" aria-label="Data flow from VCF files on the ILIFU cluster to the Beacon server: Slurm array tasks convert and validate each VCF, then the results reach MongoDB either by copying them through your computer to the Beacon server (route A, the usual one) or by a cluster import job over an SSH tunnel (route B, only when the cluster can reach the server)." font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="ar-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="ar-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
  </defs>
  <rect width="1360" height="740" fill="#ffffff"/>

  <!-- ===== zones ===== -->
  <rect x="20" y="50" width="520" height="620" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="38" y="73" font-size="14" font-weight="700" fill="#1e293b">ILIFU cluster (Slurm)</text>

  <rect x="620" y="340" width="240" height="220" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="636" y="363" font-size="14" font-weight="700" fill="#1e293b">Your computer</text>

  <rect x="960" y="130" width="380" height="540" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="978" y="153" font-size="14" font-weight="700" fill="#1e293b">Beacon server (Docker)</text>

  <!-- ===== ILIFU: login node ===== -->
  <rect x="50" y="90" width="460" height="64" rx="6" fill="#fff" stroke="#475569" stroke-width="1.5"/>
  <text x="66" y="113" font-size="13" font-weight="700" fill="#1e293b">Login node: submits, does no heavy work</text>
  <text x="66" y="134" font-size="12" fill="#475569" font-family="Menlo, Consolas, monospace">submit_multi_vcf.sh --vcf-list vcf_files.txt</text>

  <line x1="280" y1="154" x2="280" y2="198" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="290" y="181" font-size="12" fill="#475569" font-family="Menlo, Consolas, monospace">sbatch --array=1-N%P</text>

  <!-- ===== ILIFU: compute array ===== -->
  <rect x="50" y="200" width="460" height="190" rx="6" fill="#eef2f7" stroke="#475569" stroke-width="1.5"/>
  <text x="62" y="221" font-size="13" font-weight="700" fill="#1e293b">Compute nodes: one array task per VCF file</text>

  <g>
    <rect x="62" y="236" width="136" height="140" rx="5" fill="#fff" stroke="#475569"/>
    <text x="130" y="254" font-size="12" font-weight="700" text-anchor="middle" fill="#1e293b">task 1</text>
    <rect x="72" y="264" width="116" height="30" rx="4" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="130" y="283" font-size="11" text-anchor="middle" fill="#1e293b" font-family="Menlo, Consolas, monospace">vcf_to_beacon.py</text>
    <line x1="130" y1="294" x2="130" y2="318" stroke="#475569" stroke-width="1.2" marker-end="url(#ar)"/>
    <rect x="72" y="320" width="116" height="30" rx="4" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="130" y="339" font-size="11" text-anchor="middle" fill="#1e293b" font-family="Menlo, Consolas, monospace">validate_json.py</text>
    <text x="130" y="367" font-size="10" text-anchor="middle" fill="#475569">beacon-tools.sif</text>
  </g>
  <g>
    <rect x="208" y="236" width="136" height="140" rx="5" fill="#fff" stroke="#475569"/>
    <text x="276" y="254" font-size="12" font-weight="700" text-anchor="middle" fill="#1e293b">task 2</text>
    <rect x="218" y="264" width="116" height="30" rx="4" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="276" y="283" font-size="11" text-anchor="middle" fill="#1e293b" font-family="Menlo, Consolas, monospace">vcf_to_beacon.py</text>
    <line x1="276" y1="294" x2="276" y2="318" stroke="#475569" stroke-width="1.2" marker-end="url(#ar)"/>
    <rect x="218" y="320" width="116" height="30" rx="4" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="276" y="339" font-size="11" text-anchor="middle" fill="#1e293b" font-family="Menlo, Consolas, monospace">validate_json.py</text>
    <text x="276" y="367" font-size="10" text-anchor="middle" fill="#475569">beacon-tools.sif</text>
  </g>
  <g>
    <rect x="354" y="236" width="136" height="140" rx="5" fill="#fff" stroke="#475569"/>
    <text x="422" y="254" font-size="12" font-weight="700" text-anchor="middle" fill="#1e293b">task N</text>
    <rect x="364" y="264" width="116" height="30" rx="4" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="422" y="283" font-size="11" text-anchor="middle" fill="#1e293b" font-family="Menlo, Consolas, monospace">vcf_to_beacon.py</text>
    <line x1="422" y1="294" x2="422" y2="318" stroke="#475569" stroke-width="1.2" marker-end="url(#ar)"/>
    <rect x="364" y="320" width="116" height="30" rx="4" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="422" y="339" font-size="11" text-anchor="middle" fill="#1e293b" font-family="Menlo, Consolas, monospace">validate_json.py</text>
    <text x="422" y="367" font-size="10" text-anchor="middle" fill="#475569">beacon-tools.sif</text>
  </g>

  <!-- tasks <-> storage -->
  <line x1="150" y1="430" x2="150" y2="392" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="160" y="416" font-size="12" fill="#475569">reads VCF</text>
  <line x1="400" y1="392" x2="400" y2="430" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="410" y="416" font-size="12" fill="#475569">writes Beacon JSON</text>

  <!-- ===== ILIFU: shared storage ===== -->
  <rect x="50" y="432" width="460" height="76" rx="6" fill="#fff" stroke="#475569" stroke-width="1.5"/>
  <text x="66" y="453" font-size="13" font-weight="700" fill="#1e293b">/cbio/users/$USER (shared storage)</text>
  <text x="66" y="472" font-size="11" fill="#475569" font-family="Menlo, Consolas, monospace">in:  *.vcf.gz + .tbi, vcf_files.txt, dataset.yaml</text>
  <text x="66" y="490" font-size="11" fill="#475569" font-family="Menlo, Consolas, monospace">out: part_*/vcf_output/{variants_batch.jsonl, individuals.json}</text>

  <!-- storage -> import job (route B) -->
  <line x1="280" y1="508" x2="280" y2="556" stroke="#c2410c" stroke-width="1.5" marker-end="url(#ar-b)"/>
  <text x="290" y="536" font-size="12" fill="#c2410c">reads JSON</text>

  <!-- ===== ILIFU: import job (route B) ===== -->
  <rect x="50" y="558" width="460" height="84" rx="6" fill="#fff" stroke="#c2410c" stroke-width="1.5"/>
  <text x="66" y="580" font-size="13" font-weight="700" fill="#c2410c">Route B only: import job (runs after the array)</text>
  <text x="66" y="600" font-size="11" fill="#475569" font-family="Menlo, Consolas, monospace">--dependency=afterok:&lt;array&gt;  --import-only</text>
  <text x="66" y="618" font-size="11" fill="#475569" font-family="Menlo, Consolas, monospace">import_to_mongo.py, then register_dataset.py</text>
  <text x="66" y="634" font-size="10" fill="#475569">needs the cluster to reach the server on port 22: usually it cannot</text>

  <!-- ===== Route A: storage -> computer -> server ===== -->
  <line x1="510" y1="445" x2="640" y2="445" stroke="#0f766e" stroke-width="2" marker-end="url(#ar-a)"/>
  <text x="548" y="428" font-size="12" font-weight="700" fill="#0f766e">A1  scp</text>
  <text x="548" y="441" font-size="11" fill="#0f766e">download</text>

  <rect x="640" y="378" width="200" height="150" rx="6" fill="#fff" stroke="#475569" stroke-width="1.5"/>
  <text x="654" y="400" font-size="13" font-weight="700" fill="#1e293b">~/beacon_import/</text>
  <text x="654" y="422" font-size="11" fill="#475569" font-family="Menlo, Consolas, monospace">beacon_multi/</text>
  <text x="654" y="438" font-size="10" fill="#475569">  one folder per VCF, JSON files</text>
  <text x="654" y="460" font-size="11" fill="#475569" font-family="Menlo, Consolas, monospace">beacon_example/</text>
  <text x="654" y="476" font-size="10" fill="#475569">  dataset.yaml</text>
  <text x="654" y="506" font-size="10" fill="#475569">a relay: nothing runs here</text>

  <line x1="840" y1="485" x2="980" y2="485" stroke="#0f766e" stroke-width="2" marker-end="url(#ar-a)"/>
  <text x="878" y="468" font-size="12" font-weight="700" fill="#0f766e">A2  scp</text>
  <text x="878" y="481" font-size="11" fill="#0f766e">upload</text>

  <!-- ===== Beacon server ===== -->
  <rect x="980" y="160" width="340" height="82" rx="6" fill="#fff" stroke="#475569" stroke-width="1.5"/>
  <text x="996" y="182" font-size="13" font-weight="700" fill="#1e293b">Beacon API (beacon-api-boolean)</text>
  <text x="996" y="201" font-size="11" fill="#475569">Django, behind nginx; web front end on production</text>
  <text x="996" y="223" font-size="11" fill="#475569" font-family="Menlo, Consolas, monospace">manage.py create_indexes (once)</text>

  <line x1="1050" y1="242" x2="1050" y2="288" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)" marker-start="url(#ar)"/>
  <text x="1060" y="270" font-size="12" fill="#475569">cache</text>
  <line x1="1240" y1="242" x2="1240" y2="288" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="1250" y="270" font-size="12" fill="#475569">reads</text>

  <rect x="980" y="290" width="140" height="72" rx="6" fill="#fff" stroke="#475569" stroke-width="1.5"/>
  <text x="996" y="314" font-size="13" font-weight="700" fill="#1e293b">Redis</text>
  <text x="996" y="334" font-size="11" fill="#475569">query cache, 5 min</text>
  <text x="996" y="350" font-size="11" fill="#475569">dataset list, 1 h</text>

  <rect x="1160" y="290" width="160" height="112" rx="6" fill="#fff" stroke="#475569" stroke-width="1.5"/>
  <text x="1176" y="314" font-size="13" font-weight="700" fill="#1e293b">MongoDB beacon_db</text>
  <text x="1176" y="336" font-size="11" fill="#475569" font-family="Menlo, Consolas, monospace">variants</text>
  <text x="1176" y="352" font-size="11" fill="#475569" font-family="Menlo, Consolas, monospace">individuals</text>
  <text x="1176" y="368" font-size="11" fill="#475569" font-family="Menlo, Consolas, monospace">datasets</text>
  <text x="1176" y="388" font-size="10" fill="#475569">indexes from create_indexes</text>

  <rect x="980" y="440" width="170" height="124" rx="6" fill="#fff" stroke="#0f766e" stroke-width="1.5"/>
  <text x="996" y="462" font-size="13" font-weight="700" fill="#0f766e">Route A: import</text>
  <text x="996" y="480" font-size="10" fill="#475569">beacon-tools image, run on</text>
  <text x="996" y="493" font-size="10" fill="#475569">the server (--network host)</text>
  <text x="996" y="516" font-size="11" fill="#475569" font-family="Menlo, Consolas, monospace">import_to_mongo.py</text>
  <text x="996" y="534" font-size="11" fill="#475569" font-family="Menlo, Consolas, monospace">register_dataset.py</text>
  <text x="996" y="552" font-size="10" fill="#475569">the usual route</text>

  <path d="M1150,500 H1190 V404" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#ar-a)"/>
  <text x="1198" y="440" font-size="12" font-weight="700" fill="#0f766e">writes</text>

  <!-- ===== Route B: SSH tunnel straight from the import job to MongoDB ===== -->
  <path d="M510,600 H1290 V404" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar-b)"/>
  <text x="560" y="590" font-size="12" font-weight="700" fill="#c2410c">B  SSH tunnel localhost:27017 to MongoDB</text>
  <text x="560" y="618" font-size="11" fill="#c2410c">writes variants, then registers the dataset</text>

  <!-- ===== Reader ===== -->
  <rect x="980" y="40" width="340" height="56" rx="6" fill="#fff" stroke="#475569" stroke-width="1.5"/>
  <text x="996" y="62" font-size="13" font-weight="700" fill="#1e293b">Researcher or app</text>
  <text x="996" y="82" font-size="11" fill="#475569" font-family="Menlo, Consolas, monospace">GET /api/g_variants?...&amp;datasetIds=ID</text>
  <line x1="1280" y1="96" x2="1280" y2="158" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="1290" y="122" font-size="12" fill="#475569">query</text>

  <!-- ===== legend ===== -->
  <line x1="20" y1="706" x2="64" y2="706" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="74" y="710" font-size="12" fill="#475569">data or command</text>
  <line x1="260" y1="706" x2="304" y2="706" stroke="#0f766e" stroke-width="2" marker-end="url(#ar-a)"/>
  <text x="314" y="710" font-size="12" fill="#0f766e">Route A: copy results, import on the server (usual)</text>
  <line x1="700" y1="706" x2="744" y2="706" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar-b)"/>
  <text x="754" y="710" font-size="12" fill="#c2410c">Route B: cluster job imports through a tunnel (only if reachable)</text>
</svg>
