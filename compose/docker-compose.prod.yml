services:
  # MongoDB - Internal only (no exposed ports)
  mongodb:
    image: mongo:5.0
    # Deliberately UNAUTHENTICATED, same call as
    # docker-compose-boolean-ssl.yml. Access is restricted by exposing no
    # ports: this service is reachable only from the internal bridge network.
    #
    # Do NOT "fix" this by adding MONGO_INITDB_ROOT_USERNAME/PASSWORD alone.
    # Those provision a root user in the `admin` database, while this stack's
    # API runs settings_boolean (see DJANGO_SETTINGS_MODULE below), which
    # authenticates with `authSource={MONGODB_NAME}` — i.e. beacon_db.
    # Mongo would come up with auth enabled and every app connection would
    # fail against an authSource holding no such user. Adding auth means
    # adding credentials in BOTH places at once.
    #
    # Consequence worth knowing: MONGODB_USERNAME / MONGODB_PASSWORD in the
    # env file are INERT for this stack. They are not protecting anything, and
    # a reader should not infer otherwise from their presence.
    #
    # If this stack is ever actually deployed and does need auth, provision an
    # application user in beacon_db (an init script), rather than pointing the
    # app at an admin-scoped root user — that is how the live production host
    # does it, with a collection-scoped role.
    container_name: beacon-mongodb
    volumes:
      - beacon_mongodb_data:/data/db
    networks:
      - beacon-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongo localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Internal only
  redis:
    image: redis:6-alpine
    container_name: beacon-redis
    networks:
      - beacon-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Beacon API - Gunicorn (production)
  beacon-api:
    image: ${API_IMAGE:-beacon-api:latest}
    build:
      context: ..
      dockerfile: Dockerfile.boolean
    container_name: beacon-api
    env_file:
      - ../.env.production
    environment:
      - DJANGO_SETTINGS_MODULE=beacon_project.settings_boolean
      - MONGODB_HOST=mongodb
      - REDIS_HOST=redis
    volumes:
      - ../logs:/app/logs
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - beacon-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  # Frontend - Next.js standalone build
  beacon-frontend:
    image: ${FRONTEND_IMAGE:-beacon-frontend:latest}
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: beacon-frontend
    environment:
      - BACKEND_API_URL=http://beacon-api:8000
    depends_on:
      beacon-api:
        condition: service_healthy
    networks:
      - beacon-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  # Traefik - Reverse proxy with auto-TLS (Let's Encrypt)
  traefik:
    image: traefik:v3.4
    container_name: beacon-traefik
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../traefik/traefik-prod.yml:/etc/traefik/traefik.yml:ro
      - ../traefik/dynamic-prod:/etc/traefik/dynamic:ro
      - ../traefik/acme:/etc/traefik/acme
      - ../traefik/logs:/var/log/traefik
    networks:
      - beacon-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  beacon-network:
    driver: bridge

volumes:
  beacon_mongodb_data:
    driver: local
