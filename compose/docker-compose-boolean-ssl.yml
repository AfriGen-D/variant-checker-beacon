services:
  # MongoDB — internal-only, boolean mode (no auth at app level)
  mongodb:
    image: mongo:5.0
    container_name: beacon-mongodb
    # No --auth: settings_boolean.py connects as mongodb://host:port/ with no
    # credentials, so --auth without a provisioned root user does not secure
    # anything — it just makes every app connection fail. Access is instead
    # restricted by exposing no ports: this service is reachable only from the
    # internal bridge network. Adding auth means adding credentials in both
    # places at once.
    command: mongod --bind_ip_all
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    networks:
      - beacon-network
    healthcheck:
      # mongo:5.0 ships the legacy `mongo` shell; `mongosh` does not exist in
      # this image, and a healthcheck that can never pass blocks every
      # dependent service on condition: service_healthy.
      test: ["CMD", "mongo", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis cache + rate limiter
  redis:
    image: redis:6-alpine
    container_name: beacon-redis
    restart: unless-stopped
    networks:
      - beacon-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Beacon API — Django + Gunicorn (Boolean mode)
  beacon-api:
    # `image` lets CI deploy a prebuilt GHCR image by setting API_IMAGE; the
    # `build` stanza stays so a local `docker compose build` still works and
    # tags the result under the same name. Without the fallback value a plain
    # `up` with no env would try to pull an empty image reference.
    image: ${API_IMAGE:-afrigend-beacon2-beacon-api:local}
    build:
      context: ..
      dockerfile: Dockerfile.boolean
    container_name: beacon-api-boolean
    restart: unless-stopped
    environment:
      - DJANGO_SETTINGS_MODULE=beacon_project.settings_boolean
      - MONGODB_HOST=mongodb
      - REDIS_HOST=redis
    env_file:
      - ../.env.boolean
    volumes:
      - ../logs:/app/logs
      - ../staticfiles:/app/staticfiles
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - beacon-network
    # beacon_project has no wsgi_boolean module; boolean mode is selected by
    # DJANGO_SETTINGS_MODULE above, not by a separate WSGI entrypoint. The old
    # target raised ModuleNotFoundError on boot. Matches Dockerfile.boolean.
    command: gunicorn beacon_project.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120 --access-logfile - --error-logfile -
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend — Next.js 14 standalone build
  beacon-frontend:
    # NEXT_PUBLIC_BEACON_API_URL must stay empty so the browser bundle calls a
    # relative /api, which nginx proxies. Baking a host in here is what breaks
    # the live site. CI passes the same empty value as a build-arg.
    image: ${FRONTEND_IMAGE:-afrigend-beacon2-beacon-frontend:local}
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BEACON_API_URL: ""
    container_name: beacon-frontend
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - BACKEND_API_URL=http://beacon-api-boolean:8000
    depends_on:
      beacon-api:
        condition: service_healthy
    networks:
      - beacon-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # nginx — TLS termination, /api routed to beacon-api, / to beacon-frontend
  nginx:
    # Stock image with the config mounted in. There is no nginx/Dockerfile in
    # this repo, so the previous `build:` stanza made this whole compose file
    # fail immediately — including the deploy command quoted in the README.
    image: nginx:1.27-alpine
    container_name: beacon-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx-prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ../nginx/logs:/var/log/nginx
    depends_on:
      beacon-api:
        condition: service_healthy
      beacon-frontend:
        condition: service_healthy
    networks:
      - beacon-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  beacon-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
