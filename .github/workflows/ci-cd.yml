name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository }}/beacon-api
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/beacon-frontend

jobs:
  # ── Test ──────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Python tools tests (188 tests)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install runtime + test dependencies
        working-directory: afrigend-beacon2-tools
        # Install only the runtime libs that test modules import at
        # collection time. The full requirements.txt has heavy native
        # libs (pybedtools needs the bedtools binary; cyvcf2/pysam need
        # htslib headers) that we don't need for unit tests and that
        # routinely break sandboxed pip builds.
        run: |
          pip install --upgrade pip setuptools wheel
          pip install pymongo==4.6.1 mongoengine==0.27.0 pandas==2.1.4 \
                      jsonschema==4.20.0 cerberus==1.3.5 \
                      pyyaml==6.0.1 click==8.1.7 tqdm==4.66.1 colorlog==6.8.0 \
                      requests==2.31.0 pronto==2.5.4 \
                      openpyxl==3.1.2 xlrd==2.0.1 \
                      biopython==1.81 vcfpy==0.13.8
          pip install -e ".[test]"
      - name: Run Python tests
        working-directory: afrigend-beacon2-tools
        # Skip tests that need cyvcf2/pybedtools/pysam — those libs need
        # native system deps not installed on the runner.
        #
        # test_vcf_transformer.py is NOT skipped: it stubs cyvcf2 with
        # MagicMock before importing the module under test, so it needs no
        # native deps. Skipping it while [tool.coverage.run].source still
        # counted vcf_transform is what pushed coverage under --cov-fail-under
        # and made this job red.
        run: |
          python -m pytest tests/ \
            -m "not requires_cyvcf2" \
            --ignore=tests/integration/test_vcf_pipeline.py

      # Frontend lint + type-check (Node 20 for parity with frontend/Dockerfile).
      # The Type-check step is the safeguard against the
      # "gitignore silently excludes frontend/src/lib/" class of bug -
      # TypeScript fails on unresolved @/lib/... imports immediately.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Type-check frontend
        working-directory: frontend
        run: npm run type-check

  # ── Build + Push Images ───────────────────────────
  build:
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # API image
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.boolean
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Frontend image
      - uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy (tag v* only) ──────────────────────────
  deploy:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: DEPLOY_TAG,DEPLOY_API_IMAGE,DEPLOY_FRONTEND_IMAGE
          script: |
            cd ~/afrigend-beacon2
            git fetch --tags
            git checkout "$DEPLOY_TAG"
            API_IMAGE="$DEPLOY_API_IMAGE" \
            FRONTEND_IMAGE="$DEPLOY_FRONTEND_IMAGE" \
            ./scripts/deploy.sh --pull-only
        env:
          DEPLOY_TAG: ${{ github.ref_name }}
          DEPLOY_API_IMAGE: ${{ env.API_IMAGE }}:${{ github.sha }}
          DEPLOY_FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
