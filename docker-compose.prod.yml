services:
  # MongoDB - Internal only (no exposed ports)
  mongodb:
    image: mongo:5.0
    container_name: beacon-mongodb
    volumes:
      - beacon_mongodb_data:/data/db
    networks:
      - beacon-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongo localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Internal only
  redis:
    image: redis:6-alpine
    container_name: beacon-redis
    networks:
      - beacon-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Beacon API - Gunicorn (production)
  beacon-api:
    image: ${API_IMAGE:-beacon-api:latest}
    build:
      context: .
      dockerfile: Dockerfile.boolean
    container_name: beacon-api
    env_file:
      - .env.production
    environment:
      - DJANGO_SETTINGS_MODULE=beacon_project.settings_boolean
      - MONGODB_HOST=mongodb
      - REDIS_HOST=redis
    volumes:
      - ./logs:/app/logs
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - beacon-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  # Frontend - Next.js standalone build
  beacon-frontend:
    image: ${FRONTEND_IMAGE:-beacon-frontend:latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: beacon-frontend
    environment:
      - BACKEND_API_URL=http://beacon-api:8000
    depends_on:
      beacon-api:
        condition: service_healthy
    networks:
      - beacon-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  # Nginx - SSL termination + reverse proxy
  nginx:
    image: nginx:alpine
    container_name: beacon-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx-prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/logs:/var/log/nginx
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      beacon-api:
        condition: service_healthy
    networks:
      - beacon-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  beacon-network:
    driver: bridge

volumes:
  beacon_mongodb_data:
    driver: local
