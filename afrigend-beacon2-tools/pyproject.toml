[project]
name = "afrigend-beacon2-tools"
version = "0.1.0"
description = "Data transformation tools for AfriGen-D Beacon v2"
requires-python = ">=3.9"

[project.optional-dependencies]
test = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "mongomock>=4.1",
    "responses>=0.24",
]

# setuptools >=60 refuses flat-layout auto-discovery when the package has
# multiple sibling top-level dirs. Be explicit about which dirs ship.
[tool.setuptools.packages.find]
include = [
    "vcf_transform*",
    "phenotype_transform*",
    "validation*",
    "data_import*",
    "data_export*",
    "config*",
]
exclude = ["tests*", "docs*", "examples*", ".venv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Unit tests (deselect with '-m \"not unit\"')",
    "integration: Integration tests requiring more setup",
    "requires_cyvcf2: Tests requiring cyvcf2 library",
]
addopts = [
    "-v",
    "--tb=short",
    "--cov=vcf_transform",
    "--cov=phenotype_transform",
    "--cov=validation",
    "--cov=data_import",
    "--cov=data_export",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]

[tool.coverage.run]
source = [
    "vcf_transform",
    "phenotype_transform",
    "validation",
    "data_import",
    "data_export",
]
omit = ["tests/*", "*/main*"]

[tool.coverage.report]
exclude_lines = [
    "if __name__",
    "def main",
    "argparse",
    "parser.add_argument",
    "args = parser",
]
