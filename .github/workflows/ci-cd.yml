name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  # ── Test ──────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Python tools tests (188 tests)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # Backend query-correctness suites — 127 tests, ~0.01s.
      #
      # These are deliberately Django-free: no settings module, no database,
      # no network. They run on a bare interpreter before anything is
      # installed, so a query-correctness regression fails the PR in seconds
      # instead of after the tools install.
      #
      # They exist because this is the one bug class the GA4GH spec verifier
      # cannot see. beacon-verifier checks envelope shape, and it passed
      # throughout the period when position queries were off by one base.
      # A false negative — answering "no" for a variant we hold — is
      # indistinguishable from a true one to every caller.
      #
      # test_query_semantics carries LegacyContrastTests written so that
      # reverting the half-open overlap to closed-interval goes red;
      # verified by mutation (start__lt -> start__lte gives 4F/2E).
      - name: Run backend query-correctness tests
        run: |
          python -m unittest \
            beacon_api.test_query_semantics \
            beacon_api.test_query_injection \
            beacon_api.test_pagination_filters \
            beacon_api.test_assembly \
            beacon_api.test_query_vocabulary \
            beacon_api.test_capabilities \
            beacon_api.test_release \
            beacon_api.test_request_body

      # These two need Django + DRF, because validators.py and middleware.py
      # import them. The suites above are deliberately Django-free and run
      # before any install, which is why they cost ~5ms. test_middleware
      # previously ran only in deploy.yml — i.e. after the merge it should
      # have blocked, the same gap #43 closed for the others.
      - name: Run Django-dependent backend tests
        run: |
          pip install --quiet 'django==4.0.10' 'djangorestframework==3.14.0'
          python -m unittest \
            beacon_api.test_sanitizer_nested \
            beacon_api.test_middleware

      - name: Install runtime + test dependencies
        working-directory: afrigend-beacon2-tools
        # Install only the runtime libs that test modules import at
        # collection time. The full requirements.txt has heavy native
        # libs (pybedtools needs the bedtools binary; cyvcf2/pysam need
        # htslib headers) that we don't need for unit tests and that
        # routinely break sandboxed pip builds.
        run: |
          pip install --upgrade pip setuptools wheel
          pip install pymongo==4.6.1 mongoengine==0.27.0 pandas==2.1.4 \
                      jsonschema==4.20.0 cerberus==1.3.5 \
                      pyyaml==6.0.1 click==8.1.7 tqdm==4.66.1 colorlog==6.8.0 \
                      requests==2.31.0 pronto==2.5.4 \
                      openpyxl==3.1.2 xlrd==2.0.1 \
                      biopython==1.81 vcfpy==0.13.8
          pip install -e ".[test]"
      - name: Run Python tests
        working-directory: afrigend-beacon2-tools
        # Skip tests that need cyvcf2/pybedtools/pysam — those libs need
        # native system deps not installed on the runner.
        #
        # test_vcf_transformer.py is NOT skipped: it stubs cyvcf2 with
        # MagicMock before importing the module under test, so it needs no
        # native deps. Skipping it while [tool.coverage.run].source still
        # counted vcf_transform is what pushed coverage under --cov-fail-under
        # and made this job red.
        run: |
          python -m pytest tests/ \
            -m "not requires_cyvcf2" \
            --ignore=tests/integration/test_vcf_pipeline.py

      # Frontend lint + type-check (Node 20 for parity with frontend/Dockerfile).
      # The Type-check step is the safeguard against the
      # "gitignore silently excludes frontend/src/lib/" class of bug -
      # TypeScript fails on unresolved @/lib/... imports immediately.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Type-check frontend
        working-directory: frontend
        run: npm run type-check

  # ── Build + Push Images ───────────────────────────
  build:
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Resolve the image namespace in lowercase
        id: img
        # ghcr.io rejects an uppercase repository name. The org is `AfriGen-D`,
        # and ${{ github.repository }} preserves its case, so interpolating it
        # straight into an image tag fails with "repository name must be
        # lowercase". Actions expressions have no lowercase function, so it is
        # lowered here and consumed via steps.img.outputs.
        run: |
          NS=$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          echo "api=ghcr.io/${NS}/beacon-api" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${NS}/beacon-frontend" >> "$GITHUB_OUTPUT"

      # API image
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.boolean
          push: true
          tags: |
            ${{ steps.img.outputs.api }}:latest
            ${{ steps.img.outputs.api }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Frontend image
      - uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.frontend }}:latest
            ${{ steps.img.outputs.frontend }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


# Production deploy lives in deploy.yml (tag-triggered, GHCR images,
# health-gated with rollback). The old deploy job that used to sit here
# could never have worked: it ran `git fetch && git checkout` inside
# ~/afrigend-beacon2 on the prod host, which has no `origin` remote and
# thousands of lines of hand-edits, and it invoked scripts/deploy.sh
# against a compose file production does not use.
