name: Deploy to Production

# Tag-triggered production deploy, modelled on the myPandos dash pipeline
# (validate -> build -> deploy -> verify -> cleanup -> notify).
#
# Difference from dash: the beacon hosts do NOT run Docker Swarm
# (`docker info` reports `Swarm: inactive`), so there is no `docker service
# update --update-failure-action rollback` to lean on. Deployment is plain
# `docker compose`, and the rollback is done explicitly — capture the running
# image ID first, and re-pin it if the health check fails.
#
# Why images rather than `git checkout` on the host: the production tree at
# ~/afrigend-beacon2 is hand-managed and diverges from git by thousands of
# lines (and has no `origin` remote). Checking out a tag there would destroy
# prod-local edits. Shipping images makes the host's git state irrelevant.
#
# Required repository secrets:
#   DEPLOY_HOST      - production host (154.114.10.84)
#   DEPLOY_USERNAME  - SSH user on that host
#   DEPLOY_SSH_KEY   - private half of a DEDICATED CI deploy key, whose public
#                      half is in the host's ~/.ssh/authorized_keys. Do not
#                      reuse a personal identity key here.
#
# DEPLOYING IS A DELIBERATE ACT. Pushing a tag builds images; it does NOT
# deploy them. Rolling them out to production is a separate, manual trigger:
#
#   gh workflow run deploy.yml -f tag=v1.2.3
#   # or: Actions -> Deploy to Production -> Run workflow
#
# Splitting the trigger from the tag IS the gate, and it is the same shape the
# fedimpute pipeline uses. It exists because the earlier tag-triggered version
# of this workflow shipped straight to the only user-facing environment the
# moment a tag was pushed, unattended — which is how a bad image took
# beacon.afrigen-d.org down on 2026-08-05. A tag is now a build artefact and a
# rollback target, not a deployment.
#
# Deploy to the sidecar first (see the deploy-sidecar job) and let it prove the
# images before production is touched.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to deploy (e.g. v1.2.3). Images must already exist on GHCR at this tag.'
        required: true
        type: string
      skip_sidecar:
        description: 'Skip the sidecar smoke test (only when the sidecar is unavailable — you are deploying unproven images)'
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository }}/beacon-api
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/beacon-frontend

jobs:
  # Validate the tag BEFORE anything checks it out or interpolates it. The tag
  # is dispatch input, and it ends up both as an actions/checkout ref and
  # inside a shell command on the deploy host, so every later job consumes
  # `needs.preflight.outputs.version` rather than the raw input.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate tag format
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if ! printf '%s' "$INPUT_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'; then
            echo "Refusing to deploy: '$INPUT_TAG' is not a semver tag." >&2
            exit 1
          fi
          echo "version=$INPUT_TAG" >> "$GITHUB_OUTPUT"

      - name: Confirm the tag exists
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${VERSION}" >/dev/null 2>&1; then
            echo "Tag ${VERSION} does not exist in this repository." >&2
            exit 1
          fi
          echo "Tag ${VERSION} found."

  validate:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      # Type-check is the guard against the "@/lib/... resolves locally but not
      # in the image" class of bug. It must run before we spend time building.
      - name: Frontend type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rate-limit middleware tests
        # Self-contained: configures its own settings and a locmem cache, so it
        # needs neither MongoDB nor the full requirements set.
        run: |
          pip install --quiet 'django==4.0.10'
          python -m beacon_api.test_middleware

  build:
    needs: [preflight, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.version }}
          fetch-depth: 0

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.boolean
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ needs.preflight.outputs.version }}
            ${{ env.API_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          # The repo tracks frontend/Dockerfile. Production additionally has an
          # untracked frontend/docker/Dockerfile at a different path — both files
          # are byte-identical, so building from the tracked one is equivalent.
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ needs.preflight.outputs.version }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_BEACON_API_URL=

  # Prove the images on the API-only sidecar before production sees them.
  #
  # This is the environment production never had. The sidecar serves
  # api-beacon.afrigen-d.dev, has no UI and no real users, and runs the same
  # API image from the same compose definitions — so a boot failure, a missing
  # module or a healthcheck that never passes surfaces here instead of on
  # beacon.afrigen-d.org.
  #
  # Requires SIDECAR_* secrets. It sits on a private address behind the
  # jumphost, so the SSH hop is proxied (the same shape the fedimpute pipeline
  # uses for its own private prod host).
  deploy-sidecar:
    needs: [preflight, build]
    if: ${{ !inputs.skip_sidecar }}
    runs-on: ubuntu-latest
    outputs:
      smoked: ${{ steps.smoke.outputs.smoked }}
    steps:
      - name: Check the sidecar is configured
        id: cfg
        env:
          SIDECAR_HOST: ${{ secrets.SIDECAR_HOST }}
        run: |
          if [ -z "$SIDECAR_HOST" ]; then
            echo "SIDECAR_HOST is not set — the sidecar stage cannot run." >&2
            echo "Add SIDECAR_HOST / SIDECAR_USERNAME / SIDECAR_SSH_KEY and" >&2
            echo "JUMPHOST_HOST / JUMPHOST_USERNAME, or re-run with" >&2
            echo "skip_sidecar=true to deploy unproven images deliberately." >&2
            exit 1
          fi

      - name: Deploy images to the sidecar
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_VERSION: ${{ needs.preflight.outputs.version }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        with:
          host: ${{ secrets.SIDECAR_HOST }}
          username: ${{ secrets.SIDECAR_USERNAME }}
          key: ${{ secrets.SIDECAR_SSH_KEY }}
          proxy_host: ${{ secrets.JUMPHOST_HOST }}
          proxy_username: ${{ secrets.JUMPHOST_USERNAME }}
          proxy_key: ${{ secrets.SIDECAR_SSH_KEY }}
          # Without this the job's `env:` block never reaches the remote shell,
          # and `set -u` aborts on the first reference with
          # "REPO: unbound variable" (exit 127). The prod deploy job below
          # already passes the same list.
          envs: DEPLOY_VERSION,GHCR_TOKEN,GH_ACTOR,REPO
          command_timeout: 10m
          # No `set -e`: every failure below needs to be reported, not to
          # silently abort the script mid-way. Same reasoning as the prod job.
          script: |
            set -uo pipefail
            cd /opt/afrigend/beacon

            COMPOSE="docker compose -f docker-compose.sidecar.yml"
            [ -f docker-compose.sidecar.yml ] || COMPOSE="docker compose -f docker-compose.dev.yml"
            API="ghcr.io/${REPO}/beacon-api:${DEPLOY_VERSION}"

            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GH_ACTOR}" --password-stdin
            docker pull "$API" || { echo "pull failed"; exit 1; }

            export API_IMAGE="$API"
            $COMPOSE up -d --no-deps mongodb redis || true
            $COMPOSE up -d --no-deps beacon-api || echo "compose up returned non-zero; checking health anyway"

            # The API's own healthcheck has a 30s interval, so compose's
            # dependency gate can give up before the container has ever been
            # probed. Poll the endpoint directly instead of trusting that gate.
            for i in $(seq 1 30); do
              if curl -fsS --max-time 5 http://127.0.0.1:8000/api/health > /dev/null 2>&1; then
                echo "Sidecar API healthy after ${i} attempt(s)."
                exit 0
              fi
              sleep 5
            done

            echo "Sidecar API never became healthy — refusing to promote these images."
            $COMPOSE logs --tail 60 beacon-api || true
            exit 1

      - name: Smoke the sidecar through its public endpoint
        id: smoke
        run: |
          set -uo pipefail
          ok=0
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
              https://api-beacon.afrigen-d.dev/api/health || echo 000)
            echo "attempt ${i}: HTTP ${CODE}"
            if [ "$CODE" = "200" ]; then ok=1; break; fi
            sleep 10
          done
          if [ "$ok" -ne 1 ]; then
            echo "Sidecar is not answering publicly; not promoting to production." >&2
            exit 1
          fi
          # A beacon that boots but answers nothing is not proven. Exercise a
          # real query path before promoting.
          for path in /api/info /api/datasets; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
              "https://api-beacon.afrigen-d.dev${path}")
            echo "${path}: HTTP ${CODE}"
            [ "$CODE" = "200" ] || exit 1
          done
          echo "smoked=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [preflight, build, deploy-sidecar]
    # Runs when the sidecar passed, or when it was deliberately skipped.
    if: ${{ always() && needs.build.result == 'success' && (needs.deploy-sidecar.result == 'success' || inputs.skip_sidecar) }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to production host
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_VERSION: ${{ needs.build.outputs.version }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USERNAME }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_VERSION,GHCR_TOKEN,GH_ACTOR,REPO
          command_timeout: 10m
          script: |
            # NOT `set -e`. Everything below exists to recover from a bad
            # image, and an abort-on-error shell skips the recovery. An earlier
            # revision used `set -e`, so when `compose up` returned non-zero the
            # script died before the rollback — leaving production down.
            set -uo pipefail
            cd ~/afrigend-beacon2 || exit 1

            COMPOSE="docker compose -f docker-compose-boolean-ssl.yml"
            API="ghcr.io/${REPO}/beacon-api:${DEPLOY_VERSION}"
            FRONTEND="ghcr.io/${REPO}/beacon-frontend:${DEPLOY_VERSION}"

            echo "Deploying ${DEPLOY_VERSION}"
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GH_ACTOR}" --password-stdin

            # Capture what is running now, by image ID, so a rollback restores
            # the exact bits rather than whatever a tag points at later.
            PREV_API=$(docker inspect --format '{{.Image}}' beacon-api-boolean 2>/dev/null || echo "")
            PREV_FRONTEND=$(docker inspect --format '{{.Image}}' beacon-frontend 2>/dev/null || echo "")
            echo "Previous API image:      ${PREV_API:-none}"
            echo "Previous frontend image: ${PREV_FRONTEND:-none}"

            # Pull before touching anything. Without `set -e` these need
            # explicit checks — and failing here is the good case: nothing has
            # been recreated yet, so there is nothing to roll back.
            docker pull "$API" || { echo "Failed to pull $API — aborting before touching containers."; exit 1; }
            docker pull "$FRONTEND" || { echo "Failed to pull $FRONTEND — aborting before touching containers."; exit 1; }

            # API_IMAGE/FRONTEND_IMAGE are consumed by the compose file. They
            # are persisted to .env.deploy so a later manual `docker compose up`
            # on the host does not silently revert to a stale local build.
            printf 'API_IMAGE=%s\nFRONTEND_IMAGE=%s\n' "$API" "$FRONTEND" > .env.deploy

            export API_IMAGE="$API" FRONTEND_IMAGE="$FRONTEND"

            # `up` must NOT be allowed to abort the script: the whole point of
            # what follows is to recover from a bad image. It exits non-zero
            # when the new API fails its healthcheck (the frontend depends_on
            # it with condition: service_healthy), and under `set -e` that
            # killed the script before the rollback below could run — which is
            # exactly how a bad image once left production down.
            UP_OK=true
            $COMPOSE up -d --no-deps beacon-api beacon-frontend || UP_OK=false
            echo "compose up ok: ${UP_OK}"

            HEALTHY=false
            if [ "$UP_OK" = true ]; then
              echo "Waiting for API to become healthy..."
              for i in $(seq 1 24); do
                if curl -fsS --max-time 5 http://localhost/api/health > /dev/null 2>&1; then
                  HEALTHY=true
                  echo "Healthy after ${i} attempt(s)."
                  break
                fi
                sleep 5
              done
            fi

            if [ "$HEALTHY" != true ]; then
              echo "FAILED: API did not become healthy. Rolling back."
              if [ -n "$PREV_API" ]; then
                export API_IMAGE="$PREV_API" FRONTEND_IMAGE="${PREV_FRONTEND:-$FRONTEND}"
                printf 'API_IMAGE=%s\nFRONTEND_IMAGE=%s\n' "$API_IMAGE" "$FRONTEND_IMAGE" > .env.deploy
                $COMPOSE up -d --no-deps --force-recreate beacon-api beacon-frontend || true
                # nginx resolves the upstream container IPs once at startup, so
                # a recreated container is unreachable — 502 — until it re-reads
                # them, even though the container itself is healthy.
                docker exec beacon-nginx nginx -s reload || true
                echo "Rolled back to ${PREV_API}"
                for i in $(seq 1 12); do
                  curl -fsS --max-time 5 http://localhost/api/health > /dev/null 2>&1 && { echo "Rollback verified healthy."; break; }
                  sleep 5
                done
              else
                echo "No previous image recorded — cannot roll back automatically."
              fi
              $COMPOSE logs --tail 50 beacon-api || true
              exit 1
            fi

            # Same reason as the rollback path: recreated containers get new
            # IPs and nginx caches the old ones.
            docker exec beacon-nginx nginx -s reload || true

            printf '%s %s %s -> %s\n' "$DEPLOY_VERSION" "$(date -u '+%Y-%m-%d %H:%M:%S')" "${PREV_API:-none}" "$API" >> deployment.log
            echo "Deployment successful."

  verify:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Verify public endpoints
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -e
          echo "=== Post-deploy verification ==="

          HEALTH=$(curl -fsS --retry 6 --retry-delay 5 --retry-all-errors \
            --max-time 20 https://beacon.afrigen-d.org/api/health)
          echo "health: $HEALTH"
          printf '%s' "$HEALTH" | grep -q '"status":"healthy"'

          # /info is the endpoint federation partners poll; a 200 here is what
          # keeps this beacon listed as online across the network.
          for path in /api/info /api/datasets; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
              "https://beacon.afrigen-d.org${path}")
            echo "${path}: HTTP ${CODE}"
            [ "$CODE" = "200" ]
          done

          UI=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://beacon.afrigen-d.org/)
          echo "UI: HTTP ${UI}"
          [ "$UI" = "200" ]

          echo "=== Verification passed ==="

  cleanup:
    needs: [deploy, verify]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Prune old images when disk is tight
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USERNAME }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 5m
          script: |
            DISK=$(df / | tail -1 | awk '{print $5}' | tr -d '%')
            echo "Disk usage: ${DISK}%"
            if [ "$DISK" -gt 70 ]; then
              # Keep the 3 most recent of each beacon image so a rollback target
              # survives the prune.
              for repo in beacon-api beacon-frontend; do
                docker images --format '{{.Repository}}:{{.Tag}} {{.CreatedAt}}' \
                  | grep "/${repo}" | sort -k2 -r | tail -n +4 \
                  | awk '{print $1}' | xargs -r docker rmi || true
              done
              docker image prune -f || true
              echo "Cleanup done. Now: $(df / | tail -1 | awk '{print $5}')"
            else
              echo "Disk OK, skipping cleanup"
            fi

  notify:
    needs: [build, deploy, verify]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Record deployment status
        uses: actions/github-script@v7
        env:
          VERSION: ${{ needs.build.outputs.version }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        with:
          script: |
            const { VERSION, DEPLOY_RESULT, VERIFY_RESULT } = process.env;
            const ok = DEPLOY_RESULT === 'success' && VERIFY_RESULT === 'success';
            try {
              const { data: deployment } = await github.rest.repos.createDeployment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: VERSION,
                environment: 'production',
                auto_merge: false,
                required_contexts: [],
              });
              await github.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deployment.id,
                state: ok ? 'success' : 'failure',
                description: `deploy=${DEPLOY_RESULT} verify=${VERIFY_RESULT}`,
                environment_url: 'https://beacon.afrigen-d.org',
              });
            } catch (e) {
              core.warning(`Could not record deployment status: ${e.message}`);
            }
