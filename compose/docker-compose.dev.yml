services:
  # MongoDB - No authentication for boolean-only mode
  mongodb:
    image: mongo:5.0
    container_name: beacon-dev-mongodb
    ports:
      - "27017:27017"
    volumes:
      - beacon_dev_mongodb_data:/data/db
    networks:
      - beacon-dev-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongo localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:6-alpine
    container_name: beacon-dev-redis
    ports:
      - "6380:6379"
    networks:
      - beacon-dev-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Beacon API - Boolean Mode
  beacon-api:
    build:
      context: ..
      dockerfile: Dockerfile.boolean
    container_name: beacon-api-boolean
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=beacon_project.settings_boolean
      - MONGODB_HOST=mongodb
      - REDIS_HOST=redis
    env_file:
      - ../.env.boolean
    volumes:
      - ../logs:/app/logs
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - beacon-dev-network
    command: python manage.py runserver 0.0.0.0:8000 --settings=beacon_project.settings_boolean
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # Frontend runs locally (npm run dev) for fast hot-reload.
  # Start it with: cd frontend && npx next dev -p 3001

  # Traefik - Reverse proxy
  # Routes: /api -> beacon-api:8000, /* -> host:3001 (frontend)
  # Dashboard: http://localhost:8081
  traefik:
    image: traefik:v3.4
    container_name: beacon-dev-traefik
    ports:
      - "8080:80"    # HTTP entrypoint
      - "8081:8080"  # Traefik dashboard
    volumes:
      - ../traefik/traefik-dev.yml:/etc/traefik/traefik.yml:ro
      - ../traefik/dynamic:/etc/traefik/dynamic:ro
      - ../traefik/logs:/var/log/traefik
    depends_on:
      beacon-api:
        condition: service_healthy
    networks:
      - beacon-dev-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  beacon-dev-network:
    driver: bridge

volumes:
  beacon_dev_mongodb_data:
    driver: local
